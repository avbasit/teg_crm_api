name: Migrate database

# Runs Alembic against Neon. Manual only: schema changes are applied on purpose,
# never as a side effect of a deploy.
# Needs repository secret DATABASE_URL_UNPOOLED (Neon *direct* URL, no "-pooler").

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Alembic command"
        type: choice
        options: [current, upgrade head]
        default: current

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --no-dev
      - run: uv run alembic ${{ inputs.command }}
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - name: Verify schema
        run: uv run python scripts/verify_schema.py
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
