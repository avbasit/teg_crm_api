name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: requirements.txt matches uv.lock (Vercel installs from it)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o /tmp/req.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt) || \
            (echo "Run: uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o requirements.txt" && exit 1)
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # Unit tests only; live_db tests are skipped without RUN_DB_TESTS=1.
      - run: uv run pytest -q
